<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>附近停車場空置車位</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang HK", "Noto Sans TC", sans-serif;
      color: #0f172a;
      background: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      padding: 22px 16px 18px;
      color: white;
      background: #0f172a;
    }
    h1 { margin: 0 0 6px; font-size: 1.35rem; }
    header p { margin: 0; color: #cbd5e1; font-size: .9rem; }
    main { max-width: 780px; margin: auto; padding: 14px; }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
    }
    select, button {
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      padding: 0 14px;
      font: inherit;
    }
    select { background: white; border: 1px solid #cbd5e1; }
    button {
      color: white;
      background: #2563eb;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    #status {
      margin: 8px 2px 14px;
      color: #475569;
      font-size: .92rem;
    }
    .card {
      margin-bottom: 12px;
      padding: 16px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 2px 10px rgb(15 23 42 / 7%);
    }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .name { margin: 0; font-size: 1.08rem; }
    .distance {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 5px 9px;
      background: #e2e8f0;
      color: #334155;
      font-size: .8rem;
      font-weight: 700;
    }
    .address {
      margin: 7px 0 14px;
      color: #64748b;
      font-size: .9rem;
      line-height: 1.45;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat {
      padding: 11px;
      border-radius: 12px;
      background: #f8fafc;
    }
    .label { color: #64748b; font-size: .78rem; }
    .value { margin-top: 3px; font-size: 1.12rem; font-weight: 800; }
    .available { color: #15803d; }
    .full { color: #dc2626; }
    .unknown { color: #64748b; }
    .meta {
      margin-top: 10px;
      color: #94a3b8;
      font-size: .75rem;
    }
    .empty, .error {
      padding: 22px 16px;
      border-radius: 14px;
      background: white;
      text-align: center;
      line-height: 1.6;
    }
    .error { color: #b91c1c; }
    @media (max-width: 430px) {
      .controls { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>附近停車場空置車位</h1>
    <p>使用你的目前位置，按距離排列香港停車場。</p>
  </header>

  <main>
    <div class="controls">
      <select id="radius" aria-label="搜尋範圍">
        <option value="1">1 公里內</option>
        <option value="3" selected>3 公里內</option>
        <option value="5">5 公里內</option>
        <option value="10">10 公里內</option>
        <option value="999">全部停車場</option>
      </select>
      <button id="locate">定位及更新</button>
    </div>
    <div id="status">按「定位及更新」開始。</div>
    <section id="results"></section>
  </main>

  <script>
    // 運輸署停車場資料
    const BASIC_URL =
      "https://resource.data.one.gov.hk/td/carpark/basic_info_all.json";
    const VACANCY_URL =
      "https://resource.data.one.gov.hk/td/carpark/vacancy_all.json";

    const $ = (s) => document.querySelector(s);
    const button = $("#locate");
    const statusBox = $("#status");
    const results = $("#results");

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#039;"
      })[c]);
    }

    function distanceKm(lat1, lon1, lat2, lon2) {
      const toRad = d => d * Math.PI / 180;
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function findPrivateCarVacancy(carPark) {
      const vehicle = (carPark?.vehicle_type || []).find(v => v.type === "P");
      if (!vehicle) return null;

      return (vehicle.service_category || []).find(s => s.category === "HOURLY")
        || vehicle.service_category?.[0]
        || null;
    }

    // 規格沒有定義「總車位」欄位；以下只在資料日後提供常見容量欄位時讀取。
    function findCapacity(info, vacancy) {
      const candidates = [
        info.total_spaces, info.total_space, info.capacity,
        info.total_parking_spaces, vacancy?.total_spaces, vacancy?.capacity
      ];
      const value = candidates.find(v => Number.isFinite(Number(v)) && Number(v) >= 0);
      return value === undefined ? null : Number(value);
    }

    function vacancyDisplay(item) {
      if (!item) return { text: "沒有資料", cls: "unknown" };

      const type = item.vacancy_type;
      const n = Number(item.vacancy);

      if (type === "C") return { text: "停車場關閉", cls: "full" };
      if (n === -1) return { text: "沒有資料", cls: "unknown" };

      if (type === "A") {
        return n === 0
          ? { text: "已滿", cls: "full" }
          : { text: `${n} 個`, cls: "available" };
      }

      if (type === "B") {
        return n === 0
          ? { text: "已滿", cls: "full" }
          : { text: "有車位", cls: "available" };
      }

      return { text: "沒有資料", cls: "unknown" };
    }

    function getPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("此瀏覽器不支援定位。"));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          resolve,
          reject,
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
        );
      });
    }

    async function loadNearby() {
      button.disabled = true;
      results.innerHTML = "";
      statusBox.textContent = "正在取得位置及停車場資料…";

      try {
        const [position, basicRes, vacancyRes] = await Promise.all([
          getPosition(),
          fetch(BASIC_URL, { cache: "no-store" }),
          fetch(VACANCY_URL, { cache: "no-store" })
        ]);

        if (!basicRes.ok || !vacancyRes.ok) {
          throw new Error("未能讀取運輸署 API。");
        }

        const [basicData, vacancyData] = await Promise.all([
          basicRes.json(),
          vacancyRes.json()
        ]);

        const userLat = position.coords.latitude;
        const userLon = position.coords.longitude;
        const radius = Number($("#radius").value);

        const vacancyMap = new Map(
          (vacancyData.car_park || []).map(x => [x.park_id, x])
        );

        const nearby = (basicData.car_park || [])
          .map(info => ({
            info,
            distance: distanceKm(
              userLat, userLon,
              Number(info.latitude), Number(info.longitude)
            ),
            vacancyRecord: vacancyMap.get(info.park_id)
          }))
          .filter(x => Number.isFinite(x.distance) && x.distance <= radius)
          .sort((a, b) => a.distance - b.distance);

        statusBox.textContent =
          `定位準確度約 ${Math.round(position.coords.accuracy)} 米；找到 ${nearby.length} 個停車場。`;

        if (!nearby.length) {
          results.innerHTML =
            '<div class="empty">搜尋範圍內沒有參與此 API 的停車場。</div>';
          return;
        }

        results.innerHTML = nearby.map(({ info, distance, vacancyRecord }) => {
          const vacancy = findPrivateCarVacancy(vacancyRecord);
          const available = vacancyDisplay(vacancy);
          const capacity = findCapacity(info, vacancy);
          const totalText = capacity === null ? "API 未提供" : `${capacity} 個`;

          return `
            <article class="card">
              <div class="top">
                <h2 class="name">${escapeHtml(info.name_tc || info.name_en)}</h2>
                <span class="distance">${distance.toFixed(2)} km</span>
              </div>
              <div class="address">
                ${escapeHtml(info.displayaddress_tc || info.displayaddress_en || "地址未提供")}
              </div>
              <div class="stats">
                <div class="stat">
                  <div class="label">總提供車位</div>
                  <div class="value ${capacity === null ? "unknown" : ""}">
                    ${totalText}
                  </div>
                </div>
                <div class="stat">
                  <div class="label">剩餘車位</div>
                  <div class="value ${available.cls}">
                    ${available.text}
                  </div>
                </div>
              </div>
              <div class="meta">
                私家車／客貨車・時租
                ${vacancy?.lastupdate ? `・更新：${escapeHtml(vacancy.lastupdate)}` : ""}
              </div>
            </article>`;
        }).join("");

      } catch (error) {
        console.error(error);
        let message = error.message || "發生錯誤。";

        if (error.code === 1) message = "定位權限被拒絕，請允許瀏覽器使用位置。";
        if (error.code === 2) message = "暫時無法取得位置。";
        if (error.code === 3) message = "取得位置逾時，請再試一次。";

        results.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        statusBox.textContent =
          "提示：定位功能需要以 HTTPS 網址或 localhost 開啟。";
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", loadNearby);
    $("#radius").addEventListener("change", () => {
      if (results.children.length) loadNearby();
    });
  </script>
</body>
</html>
