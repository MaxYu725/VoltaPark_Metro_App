<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltaPark</title>
    <!-- 引入 MapLibre GL JS 樣式與指令碼 -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <style>
        /* 基礎 Metro UI 設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 頂部導覽列 */
        .pivot-container {
            padding: 25px 20px 10px 20px;
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .pivot-container::-webkit-scrollbar { display: none; }

        .pivot-header {
            font-size: 42px;
            font-weight: 300;
            color: #555555;
            margin-right: 25px;
            cursor: pointer;
            transition: color 0.3s;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .pivot-header.active { color: #ffffff; }

        /* 通用頁面內容區 */
        .pivot-content {
            flex: 1;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .pivot-content.active { display: block; }

        /* 特別處理 #nearby 頁面：上下固定 + 無寬地圖 */
        #nearby.pivot-content {
            padding: 0;
            overflow: hidden;
        }
        #nearby.pivot-content.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 頂部狀態列 */
        .status-bar {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-text {
            font-size: 14px;
            color: #888;
            text-transform: lowercase;
        }

        /* Nearby 地圖視圖（貼合螢幕左右邊界 0 Distance） */
        .map-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #111;
            flex-shrink: 0;
            border-bottom: 1px solid #222;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-locate-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            width: 34px;
            height: 34px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #444;
            color: #fa6800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            border-radius: 4px;
        }

        /* 半徑滑桿 Metro 風格 */
        .radius-control {
            padding: 12px 20px 8px 20px;
            background-color: #000000;
            flex-shrink: 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .radius-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .radius-title { font-size: 16px; font-weight: 300; }
        .radius-value { font-size: 18px; color: #fa6800; font-weight: 400; }

        .slider-container {
            width: 100%;
            position: relative;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus { outline: none; }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 5px;
            cursor: pointer;
            background: #fa6800;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 10px;
            background: #ffffff;
            border: 1px solid #fa6800;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
        }

        .radius-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        /* 獨立滾動的 Nearby 列表區域 */
        #nearby-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px 20px 15px;
            position: relative;
            scroll-behavior: smooth; /* 平滑滾動 */
        }

        /* 地圖精細標籤樣式 */
        .park-marker-container {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .park-marker-dot {
            width: 8px;
            height: 8px;
            background-color: #1ba1e2;
            border: 1px solid #ffffff;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .park-marker-badge {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.75);
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .park-marker-container.active .park-marker-dot {
            background-color: #fa6800;
            transform: scale(1.6);
            border-color: #ffffff;
            box-shadow: 0 0 8px #fa6800;
        }

        .park-marker-container.active .park-marker-badge {
            color: #fa6800;
            border-color: #fa6800;
            background: rgba(0, 0, 0, 0.95);
        }

        .user-marker {
            width: 12px;
            height: 12px;
            background: #fa6800;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(250, 104, 0, 0.8);
        }

        /* Nearby 列表項目與高亮效果 */
        .nearby-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #222;
            border-left: 4px solid transparent;
            cursor: pointer;
            transition: background-color 0.3s ease, border-left-color 0.3s ease;
        }

        .nearby-item.active {
            background-color: rgba(250, 104, 0, 0.18);
            border-left-color: #fa6800;
        }

        .nearby-dist {
            font-size: 15px;
            color: #fa6800;
            min-width: 70px;
            font-weight: 400;
        }

        .nearby-info {
            flex: 1;
            padding: 0 10px;
            overflow: hidden;
        }

        .nearby-name {
            font-size: 18px;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nearby-addr {
            font-size: 12px;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .nearby-val {
            font-size: 28px;
            font-weight: 300;
            min-width: 45px;
            text-align: right;
        }

        /* 主頁動態磚 */
        .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-items: start;
        }

        .tile {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .tile.square { aspect-ratio: 1; }
        .tile:active { transform: scale(0.97); }
        .tile.wide { grid-column: span 2; min-height: 150px; }

        .tile-title { font-size: 16px; font-weight: 400; letter-spacing: 0.5px; }
        .tile-value { font-size: 48px; font-weight: 300; text-align: right; line-height: 1; }

        .bg-blue { background-color: #1ba1e2; }
        .bg-green { background-color: #60a917; }
        .bg-orange { background-color: #fa6800; }
        .bg-teal { background-color: #00aba9; }

        .nearest-expanded {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
        }

        .tile.expanded .nearest-expanded {
            max-height: 250px;
            opacity: 1;
            margin-top: 15px;
        }

        .compact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .compact-item:first-child { border-top: none; padding-top: 0; }
        .compact-info { display: flex; flex-direction: column; overflow: hidden; }
        .compact-name { font-size: 16px; font-weight: 400; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
        .compact-dist { font-size: 12px; color: rgba(255, 255, 255, 0.7); margin-top: 2px; }
        .compact-val { font-size: 24px; font-weight: 300; }

        /* 停車場列表項目 */
        .park-item {
            background-color: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-left: 6px solid #555;
        }

        .park-item.status-available { border-left-color: #60a917; }
        .park-item.status-full { border-left-color: #ce352c; }
        .park-item.status-unknown { border-left-color: #444444; opacity: 0.8; }

        .park-info { flex: 1; padding-right: 10px; }
        .park-title { font-size: 22px; font-weight: 400; margin-bottom: 4px; line-height: 1.2; }
        .park-address { font-size: 13px; color: #aaa; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .park-distance { font-size: 14px; color: #1ba1e2; font-weight: 600; }

        .park-numbers { text-align: right; min-width: 80px; }
        .park-available { font-size: 36px; font-weight: 300; line-height: 1; }
        .park-item.status-full .park-available { color: #ce352c; }
        .park-item.status-unknown .park-available { color: #888; font-size: 18px; font-weight: 400; margin-bottom: 5px; }
        .park-total { font-size: 12px; color: #888; margin-top: 4px; }

        /* 充電站列表項目 */
        .ev-item {
            background-color: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-left: 6px solid #60a917;
        }

        .ev-header { padding: 15px 15px 10px 15px; }
        .ev-title { font-size: 24px; font-weight: 400; margin-bottom: 4px; }
        .ev-address { font-size: 13px; color: #aaaaaa; margin-bottom: 4px; }
        .ev-distance { font-size: 14px; color: #60a917; font-weight: 600; }

        .ev-chargers { display: flex; background-color: #252525; padding: 12px 15px; justify-content: space-between; }
        .charger-type { display: flex; flex-direction: column; flex: 1; }
        .charger-label { font-size: 12px; color: #888; margin-bottom: 2px; }
        .charger-data { font-size: 14px; color: #ccc; }
        .charger-data span { font-size: 28px; font-weight: 300; color: #ffffff; margin-right: 2px; }

        .available-high span { color: #60a917; }
        .loading-text { color: #888; font-size: 18px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Metro Pivot Headers -->
        <div class="pivot-container" id="pivot-headers">
            <span class="pivot-header active" data-target="nearby">nearby</span>
            <span class="pivot-header" data-target="home">home</span>
            <span class="pivot-header" data-target="parking">parking</span>
            <span class="pivot-header" data-target="ev">ev charge</span>
        </div>

        <!-- Nearby Page (地圖與半徑搜尋) -->
        <div class="pivot-content active" id="nearby">
            <!-- 固定地圖 (全寬 Edge-to-Edge) -->
            <div class="map-wrapper">
                <div class="map-locate-btn" onclick="centerUserLocation()" title="重新定位">⊕</div>
                <div id="map"></div>
            </div>

            <!-- 固定滑桿控制項 -->
            <div class="radius-control">
                <div class="radius-header">
                    <span class="radius-title">搜尋半徑</span>
                    <span class="radius-value" id="radius-val">5.0 公里</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="radius-slider" min="0.2" max="5.0" step="0.1" value="5.0">
                </div>
                <div class="radius-labels">
                    <span>200 米</span>
                    <span>5 公里</span>
                </div>
            </div>

            <!-- 下方獨立滾動列表 -->
            <div id="nearby-list">
                <div class="loading-text">正在取得位置與資料...</div>
            </div>
        </div>

        <!-- Home Page -->
        <div class="pivot-content" id="home">
            <div class="status-bar">
                <span class="status-text location-status">等待初始化...</span>
            </div>
            <div class="tile-grid">
                <div class="tile wide bg-blue" onclick="this.classList.toggle('expanded')">
                    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div class="tile-title">最近停車場</div>
                            <div id="dash-nearest-dist" style="font-size:14px; opacity:0.8;">--</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px;">
                            <div id="dash-nearest-name" style="font-size: 24px; font-weight: 400; line-height: 1.1; max-width: 65%;">等待定位...</div>
                            <div id="dash-nearest-val" style="font-size: 48px; font-weight: 300; line-height: 1;">--</div>
                        </div>
                    </div>
                    <div class="nearest-expanded" id="dash-expanded-list"></div>
                </div>

                <div class="tile square bg-green" onclick="navigateTo('ev')">
                    <div class="tile-title">可用快充</div>
                    <div class="tile-value" id="dash-ev-fast">--</div>
                </div>
                <div class="tile square bg-teal" onclick="navigateTo('ev')">
                    <div class="tile-title">可用中充</div>
                    <div class="tile-value" id="dash-ev-mid">--</div>
                </div>
                <div class="tile square bg-orange">
                    <div class="tile-title">API 連線</div>
                    <div class="tile-value" id="dash-api-status" style="font-size: 28px; margin-top: 20px;">等待中</div>
                </div>
            </div>
        </div>

        <!-- Parking Page -->
        <div class="pivot-content" id="parking">
            <div class="status-bar">
                <span class="status-text location-status">等待定位中...</span>
            </div>
            <div id="parking-list">
                <div class="loading-text">正在等待定位以載入附近資料...</div>
            </div>
        </div>

        <!-- EV Charge Page -->
        <div class="pivot-content" id="ev">
            <div class="status-bar">
                <span class="status-text location-status">等待定位中...</span>
            </div>
            <div id="ev-list">
                <div class="loading-text">正在載入充電站資料...</div>
            </div>
        </div>
    </div>

    <script>
        let evStations = [
            { id: "ev_001", name: "MegaBox (Tesla)", address: "九龍灣宏照道38號", lat: 22.3197, lng: 114.2081, status: "online", fast: { total: 6, available: 2 }, medium: { total: 10, available: 4 } },
            { id: "ev_002", name: "E-Max (中電)", address: "九龍灣展貿徑1號", lat: 22.3242, lng: 114.2045, status: "online", fast: { total: 3, available: 0 }, medium: { total: 8, available: 1 } },
            { id: "ev_003", name: "德福廣場一期", address: "九龍灣偉業街33號", lat: 22.3218, lng: 114.2133, status: "online", fast: { total: 2, available: 1 }, medium: { total: 0, available: 0 } }
        ];

        let parkingStations = [];
        let cachedData = [];
        let lastPosition = null;
        let map = null;
        let userMarker = null;
        let mapMarkersMap = new Map();
        let currentRadius = 5.0; 
        let selectedParkId = null;

        const BASIC_URL = "https://resource.data.one.gov.hk/td/carpark/basic_info_all.json";
        const VACANCY_URL = "https://resource.data.one.gov.hk/td/carpark/vacancy_all.json";

        document.addEventListener('DOMContentLoaded', () => {
            initPivot();
            initMap();
            initRadiusSlider();
            startAppProcess();
        });

        function initPivot() {
            const headers = document.querySelectorAll('.pivot-header');
            headers.forEach(header => {
                header.addEventListener('click', () => {
                    navigateTo(header.getAttribute('data-target'));
                });
            });
        }

        function navigateTo(targetId) {
            document.querySelectorAll('.pivot-header').forEach(h => {
                if(h.getAttribute('data-target') === targetId) {
                    h.classList.add('active');
                    h.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    h.classList.remove('active');
                }
            });
            document.querySelectorAll('.pivot-content').forEach(c => {
                c.classList.remove('active');
                if(c.id === targetId) c.classList.add('active');
            });

            if (targetId === 'nearby' && map) {
                setTimeout(() => map.resize(), 100);
            }
        }

        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                center: [114.2140, 22.3235],
                zoom: 13,
                attributionControl: false
            });
        }

        function centerUserLocation() {
            if (lastPosition && map) {
                map.flyTo({
                    center: [lastPosition.coords.longitude, lastPosition.coords.latitude],
                    zoom: 14,
                    speed: 1.2
                });
            }
        }

        function initRadiusSlider() {
            const slider = document.getElementById('radius-slider');
            const valDisplay = document.getElementById('radius-val');

            slider.addEventListener('input', (e) => {
                currentRadius = parseFloat(e.target.value);
                valDisplay.innerText = formatDistanceDisplay(currentRadius);
                renderNearbyPage();
            });
        }

        function distanceKm(lat1, lon1, lat2, lon2) {
            const toRad = value => value * Math.PI / 180;
            const earthRadiusKm = 6371;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return 2 * earthRadiusKm * Math.asin(Math.sqrt(a));
        }

        function formatDistanceDisplay(distKm) {
            if (distKm < 1) {
                return Math.round(distKm * 1000) + " 米";
            } else {
                return distKm.toFixed(1) + " 公里";
            }
        }

        function findPrivateCarVacancy(carPark) {
            const vehicle = (carPark?.vehicle_type || []).find(item => item.type === "P");
            if (!vehicle) return null;
            return (vehicle.service_category || []).find(item => item.category === "HOURLY") || vehicle.service_category?.[0] || null;
        }

        function formatVacancy(vacancyType, vacancy) {
            const numericVacancy = Number(vacancy);
            if (vacancyType === "C") return { text: "關閉", cssClass: "full" };
            if (vacancy === null || vacancy === undefined || numericVacancy === -1) return { text: "--", cssClass: "unknown" };
            if (vacancyType === "A") return { text: numericVacancy === 0 ? "0" : numericVacancy, cssClass: numericVacancy === 0 ? "full" : "available" };
            if (vacancyType === "B") return { text: numericVacancy === 0 ? "0" : "有", cssClass: numericVacancy === 0 ? "full" : "available" };
            return { text: "--", cssClass: "unknown" };
        }

        function normalizeGovernmentData(basicData, vacancyData) {
            const vacancyMap = new Map((vacancyData.car_park || []).map(item => [item.park_id, item]));
            return (basicData.car_park || []).map(info => {
                const vacancyRecord = vacancyMap.get(info.park_id);
                const vacancy = findPrivateCarVacancy(vacancyRecord);
                return {
                    id: String(info.park_id).trim(),
                    name: info.name_tc || info.name_en || "未命名停車場",
                    address: info.displayAddress_tc || info.displayaddress_tc || info.displayAddress_en || info.displayaddress_en || "地址未提供",
                    latitude: Number(info.latitude),
                    longitude: Number(info.longitude),
                    vacancy: vacancy?.vacancy ?? null,
                    vacancyType: vacancy?.vacancy_type || "A"
                };
            }).filter(item => Number.isFinite(item.latitude) && Number.isFinite(item.longitude));
        }

        function getPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error("不支援定位"));
                    return;
                }
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true, timeout: 12000, maximumAge: 60000
                });
            });
        }

        async function startAppProcess() {
            updateStatusText("正在取得位置及停車場資料...");
            try {
                const [position, basicResponse, vacancyResponse] = await Promise.all([
                    getPosition().catch(() => null),
                    fetch(BASIC_URL, { cache: "no-store" }),
                    fetch(VACANCY_URL, { cache: "no-store" })
                ]);

                if (!basicResponse.ok || !vacancyResponse.ok) throw new Error("API 下載失敗");

                const [basicData, vacancyData] = await Promise.all([basicResponse.json(), vacancyResponse.json()]);
                cachedData = normalizeGovernmentData(basicData, vacancyData);

                document.getElementById('dash-api-status').innerText = "正常";
                document.getElementById('dash-api-status').style.color = "#ffffff";

                lastPosition = position;
                
                if (lastPosition) {
                    const uLat = lastPosition.coords.latitude;
                    const uLng = lastPosition.coords.longitude;
                    
                    if (map) {
                        map.setCenter([uLng, uLat]);
                        if (userMarker) userMarker.remove();
                        const el = document.createElement('div');
                        el.className = 'user-marker';
                        userMarker = new maplibregl.Marker({ element: el }).setLngLat([uLng, uLat]).addTo(map);
                    }

                    processDataWithLocation(uLat, uLng);
                    updateStatusText("已定位，顯示附近資料");
                } else {
                    parkingStations = cachedData;
                    renderParkingStations();
                    renderNearbyPage();
                    updateStatusText("未授權定位");
                }

            } catch (error) {
                console.error(error);
                document.getElementById('dash-api-status').innerText = "連線失敗";
                updateStatusText("API 錯誤");
            }
        }

        function processDataWithLocation(userLat, userLon) {
            parkingStations = cachedData.map(item => {
                const dist = distanceKm(userLat, userLon, item.latitude, item.longitude);
                return { ...item, rawDistance: dist, distanceDisplay: formatDistanceDisplay(dist) };
            }).sort((a, b) => a.rawDistance - b.rawDistance);

            evStations.forEach(station => {
                station.rawDistance = distanceKm(userLat, userLon, station.lat, station.lng);
                station.distanceDisplay = formatDistanceDisplay(station.rawDistance);
            });
            evStations.sort((a, b) => a.rawDistance - b.rawDistance);

            renderNearbyPage();
            renderParkingStations();
            renderEvStations();
            updateDashboard();
        }

        // 精確連動邏輯：地圖飛行 + 精確將列表項目置於「列表視窗區域中央」
        function selectCarpark(parkId) {
            selectedParkId = parkId;
            const park = parkingStations.find(p => p.id === parkId);
            if (!park) return;

            // 1. 地圖平滑飛行至該座標並放大
            if (map) {
                map.flyTo({
                    center: [park.longitude, park.latitude],
                    zoom: 16,
                    speed: 1.2,
                    curve: 1.4
                });
            }

            // 2. 更新地圖標籤高亮狀態
            mapMarkersMap.forEach((marker, id) => {
                const el = marker.getElement();
                if (id === parkId) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // 3. 更新列表項目高亮，並計算距離「列表視窗中央」的偏移量平滑滾動
            const listContainer = document.getElementById('nearby-list');
            const listItems = document.querySelectorAll('.nearby-item');
            
            listItems.forEach(item => {
                if (item.dataset.id === parkId) {
                    item.classList.add('active');
                    
                    // 精確計算置中 Top 距離（相對於 #nearby-list 容器視窗，非全螢幕）
                    const containerHeight = listContainer.clientHeight;
                    const itemTop = item.offsetTop - listContainer.offsetTop;
                    const itemHeight = item.clientHeight;
                    const targetScrollTop = itemTop - (containerHeight / 2) + (itemHeight / 2);

                    listContainer.scrollTo({
                        top: targetScrollTop,
                        behavior: 'smooth'
                    });
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 渲染 Nearby 頁面
        function renderNearbyPage() {
            const listEl = document.getElementById('nearby-list');
            listEl.innerHTML = '';

            mapMarkersMap.forEach(m => m.remove());
            mapMarkersMap.clear();

            const filtered = parkingStations.filter(p => p.rawDistance <= currentRadius);

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="loading-text">搜尋半徑內沒有找到停車場</div>';
                return;
            }

            filtered.forEach(park => {
                const vacancyInfo = formatVacancy(park.vacancyType, park.vacancy);
                
                // 地圖細小標籤 Marker
                if (map) {
                    const container = document.createElement('div');
                    container.className = `park-marker-container ${selectedParkId === park.id ? 'active' : ''}`;
                    container.dataset.id = park.id;
                    container.innerHTML = `
                        <div class="park-marker-dot"></div>
                        <div class="park-marker-badge">${vacancyInfo.text}</div>
                    `;

                    container.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectCarpark(park.id);
                    });

                    const marker = new maplibregl.Marker({ element: container, anchor: 'left' })
                        .setLngLat([park.longitude, park.latitude])
                        .addTo(map);

                    mapMarkersMap.set(park.id, marker);
                }

                // 下方列表項目
                const itemEl = document.createElement('div');
                itemEl.className = `nearby-item ${selectedParkId === park.id ? 'active' : ''}`;
                itemEl.dataset.id = park.id;
                itemEl.innerHTML = `
                    <div class="nearby-dist">${park.distanceDisplay}</div>
                    <div class="nearby-info">
                        <div class="nearby-name">${park.name}</div>
                        <div class="nearby-addr">${park.address}</div>
                    </div>
                    <div class="nearby-val" style="${vacancyInfo.cssClass === 'full' ? 'color:#ce352c;' : ''}">
                        ${vacancyInfo.text}
                    </div>
                `;

                itemEl.addEventListener('click', () => {
                    selectCarpark(park.id);
                });

                listEl.appendChild(itemEl);
            });
        }

        function updateStatusText(text) {
            document.querySelectorAll('.location-status').forEach(el => el.innerText = text);
        }

        function updateDashboard() {
            const dashName = document.getElementById('dash-nearest-name');
            const dashDist = document.getElementById('dash-nearest-dist');
            const dashVal = document.getElementById('dash-nearest-val');
            const dashExpandList = document.getElementById('dash-expanded-list');

            if (parkingStations.length > 0) {
                const nearest = parkingStations[0];
                const vacancyInfo = formatVacancy(nearest.vacancyType, nearest.vacancy);
                
                dashName.innerText = nearest.name;
                dashDist.innerText = nearest.distanceDisplay;
                dashVal.innerText = vacancyInfo.text;
                
                dashExpandList.innerHTML = '';
                const nextThree = parkingStations.slice(1, 4);
                nextThree.forEach(p => {
                    const vInfo = formatVacancy(p.vacancyType, p.vacancy);
                    dashExpandList.innerHTML += `
                        <div class="compact-item">
                            <div class="compact-info">
                                <span class="compact-name">${p.name}</span>
                                <span class="compact-dist">${p.distanceDisplay}</span>
                            </div>
                            <span class="compact-val">${vInfo.text}</span>
                        </div>
                    `;
                });
            }
        }

        function renderParkingStations() {
            const listEl = document.getElementById('parking-list');
            listEl.innerHTML = '';
            
            parkingStations.slice(0, 30).forEach(park => {
                const vacancyInfo = formatVacancy(park.vacancyType, park.vacancy);
                listEl.innerHTML += `
                    <div class="park-item status-${vacancyInfo.cssClass}">
                        <div class="park-info">
                            <div class="park-title">${park.name}</div>
                            <div class="park-address">${park.address}</div>
                            <div class="park-distance">${park.distanceDisplay || '--'}</div>
                        </div>
                        <div class="park-numbers">
                            <div class="park-available">${vacancyInfo.text}</div>
                            <div class="park-total">車位</div>
                        </div>
                    </div>
                `;
            });
        }

        function renderEvStations() {
            const evListEl = document.getElementById('ev-list');
            evListEl.innerHTML = '';
            evStations.forEach(station => {
                evListEl.innerHTML += `
                    <div class="ev-item">
                        <div class="ev-header">
                            <div class="ev-title">${station.name}</div>
                            <div class="ev-address">${station.address}</div>
                            <div class="ev-distance">${station.distanceDisplay || '--'}</div>
                        </div>
                        <div class="ev-chargers">
                            <div class="charger-type">
                                <span class="charger-label">快速充電 (DC)</span>
                                <div class="charger-data available-high"><span>${station.fast.available}</span> / ${station.fast.total}</div>
                            </div>
                            <div class="charger-type">
                                <span class="charger-label">中速充電 (AC)</span>
                                <div class="charger-data available-high"><span>${station.medium.available}</span> / ${station.medium.total}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
