<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltaPark</title>
    <style>
        /* 基礎 Metro UI 設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部導覽列 (Pivot Headers) */
        .pivot-container {
            padding: 30px 20px 10px 20px;
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .pivot-container::-webkit-scrollbar {
            display: none;
        }

        .pivot-header {
            font-size: 42px;
            font-weight: 300;
            color: #555555;
            margin-right: 25px;
            cursor: pointer;
            transition: color 0.3s;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .pivot-header.active {
            color: #ffffff;
        }

        /* 頁面內容區 */
        .pivot-content {
            flex: 1;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .pivot-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 頂部狀態列 */
        .status-bar {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-text {
            font-size: 14px;
            color: #888;
            text-transform: lowercase;
        }

        .action-text {
            font-size: 14px;
            color: #60a917;
            cursor: pointer;
            text-transform: lowercase;
        }

        /* 主頁動態磚 (Live Tiles) */
        .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .tile {
            aspect-ratio: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .tile:active {
            transform: scale(0.96);
        }

        .tile.wide {
            grid-column: span 2;
            aspect-ratio: 2.1 / 1;
        }

        .tile-title {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .tile-value {
            font-size: 48px;
            font-weight: 300;
            text-align: right;
            line-height: 1;
        }

        /* 顏色定義 */
        .bg-blue { background-color: #1ba1e2; }
        .bg-green { background-color: #60a917; }
        .bg-orange { background-color: #fa6800; }
        .bg-teal { background-color: #00aba9; }

        /* 停車場列表項目 (Parking Tile) */
        .park-item {
            background-color: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-left: 6px solid #555;
        }

        .park-item.status-good { border-left-color: #60a917; }
        .park-item.status-warning { border-left-color: #fa6800; }
        .park-item.status-full { border-left-color: #ce352c; opacity: 0.6; }

        .park-info { flex: 1; }
        
        .park-title {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .park-address {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .park-distance {
            font-size: 14px;
            color: #1ba1e2; 
            font-weight: 600;
        }

        .park-numbers {
            text-align: right;
            min-width: 70px;
        }

        .park-available {
            font-size: 42px;
            font-weight: 300;
            line-height: 1;
        }

        .park-item.status-full .park-available { color: #ce352c; }
        .park-item.status-warning .park-available { color: #fa6800; }
        
        .park-total {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        /* 充電站列表項目 (EV Tile) */
        .ev-item {
            background-color: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-left: 6px solid #60a917;
        }

        .ev-item.offline { border-left-color: #555555; }
        .ev-item.offline .ev-title { color: #888888; }
        .ev-item.offline .ev-distance { color: #555555; }

        .ev-header { padding: 15px 15px 10px 15px; }
        .ev-title { font-size: 24px; font-weight: 400; margin-bottom: 4px; }
        .ev-address { font-size: 13px; color: #aaaaaa; margin-bottom: 4px; }
        .ev-distance { font-size: 14px; color: #60a917; font-weight: 600; }

        .ev-chargers {
            display: flex;
            background-color: #252525;
            padding: 12px 15px;
            justify-content: space-between;
        }

        .charger-type { display: flex; flex-direction: column; flex: 1; }
        .charger-label { font-size: 12px; color: #888; margin-bottom: 2px; }
        .charger-data { font-size: 14px; color: #ccc; }
        .charger-data span { font-size: 28px; font-weight: 300; color: #ffffff; margin-right: 2px; }

        .available-high span { color: #60a917; }
        .available-low span { color: #fa6800; }
        .available-none span { color: #ce352c; }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Pivot Headers -->
        <div class="pivot-container" id="pivot-headers">
            <span class="pivot-header active" data-target="home">home</span>
            <span class="pivot-header" data-target="parking">parking</span>
            <span class="pivot-header" data-target="ev">ev charge</span>
        </div>

        <!-- Home Page -->
        <div class="pivot-content active" id="home">
            <div class="status-bar">
                <span class="status-text location-status">等待授權定位...</span>
            </div>
            <div class="tile-grid">
                <div class="tile wide bg-blue" onclick="navigateTo('parking')">
                    <div class="tile-title">附近空餘車位</div>
                    <div class="tile-value" id="dash-parking-total">--</div>
                </div>
                <div class="tile bg-green" onclick="navigateTo('ev')">
                    <div class="tile-title">可用快充</div>
                    <div class="tile-value" id="dash-ev-fast">--</div>
                </div>
                <div class="tile bg-teal" onclick="navigateTo('ev')">
                    <div class="tile-title">可用中充</div>
                    <div class="tile-value" id="dash-ev-mid">--</div>
                </div>
                <div class="tile bg-orange">
                    <div class="tile-title">系統狀態</div>
                    <div class="tile-value" style="font-size: 32px; margin-top: 20px;">良好</div>
                </div>
            </div>
        </div>

        <!-- Parking Page -->
        <div class="pivot-content" id="parking">
            <div class="status-bar">
                <span class="status-text location-status">計算距離中...</span>
            </div>
            <div id="parking-list"></div>
        </div>

        <!-- EV Charge Page -->
        <div class="pivot-content" id="ev">
            <div class="status-bar">
                <span class="status-text location-status">計算距離中...</span>
                <span class="action-text">篩選插頭類型</span>
            </div>
            <div id="ev-list"></div>
        </div>
    </div>

    <script>
        // --- 模擬數據 (已補上真實經緯度) ---
        let mockEvStations = [
            { id: "ev_001", name: "領展 - 祥華商場", address: "粉嶺新運路38號", lat: 22.4918, lng: 114.1430, distance: "等待定位...", status: "online", fast: { total: 3, available: 2 }, medium: { total: 5, available: 0 } },
            { id: "ev_002", name: "海聯廣場", address: "粉嶺聯和墟和睦路9號", lat: 22.4990, lng: 114.1470, distance: "等待定位...", status: "online", fast: { total: 2, available: 0 }, medium: { total: 4, available: 1 } },
            { id: "ev_003", name: "Tesla 超充 - 上水匯", address: "上水石湖墟龍琛路48號", lat: 22.5033, lng: 114.1273, distance: "等待定位...", status: "online", fast: { total: 6, available: 5 }, medium: { total: 0, available: 0 } },
            { id: "ev_004", name: "粉嶺中心 (維護中)", address: "粉嶺新運路33號", lat: 22.4925, lng: 114.1400, distance: "等待定位...", status: "offline", fast: { total: 2, available: 0 }, medium: { total: 2, available: 0 } }
        ];

        let mockParkingStations = [
            { id: "p_001", name: "上水匯停車場", address: "上水石湖墟龍琛路48號", lat: 22.5033, lng: 114.1273, distance: "等待定位...", total: 150, available: 42 },
            { id: "p_002", name: "粉嶺中心停車場", address: "粉嶺新運路33號", lat: 22.4925, lng: 114.1400, distance: "等待定位...", total: 200, available: 12 },
            { id: "p_003", name: "聯和墟市政大廈", address: "粉嶺和滿街9號", lat: 22.4975, lng: 114.1458, distance: "等待定位...", total: 80, available: 0 },
            { id: "p_004", name: "海聯廣場停車場", address: "粉嶺聯和墟和睦路9號", lat: 22.4990, lng: 114.1470, distance: "等待定位...", total: 120, available: 65 }
        ];

        // --- 初始化邏輯 ---
        document.addEventListener('DOMContentLoaded', () => {
            initPivot();
            updateDashboard();
            
            // 先渲染一次骨架與假資料
            renderEvStations();
            renderParkingStations();
            
            // 嘗試獲取 GPS 定位
            getUserLocation();
        });

        // --- 導覽切換 ---
        function initPivot() {
            const headers = document.querySelectorAll('.pivot-header');
            headers.forEach(header => {
                header.addEventListener('click', () => {
                    navigateTo(header.getAttribute('data-target'));
                });
            });
        }

        function navigateTo(targetId) {
            document.querySelectorAll('.pivot-header').forEach(h => {
                if(h.getAttribute('data-target') === targetId) {
                    h.classList.add('active');
                    h.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    h.classList.remove('active');
                }
            });
            document.querySelectorAll('.pivot-content').forEach(c => {
                c.classList.remove('active');
                if(c.id === targetId) c.classList.add('active');
            });
        }

        // --- GPS 與距離運算 ---
        
        // Haversine 公式：計算兩點經緯度的直線距離 (回傳單位：公里)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球半徑 (公里)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 獲取使用者位置
        function getUserLocation() {
            const statusElements = document.querySelectorAll('.location-status');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        
                        // 計算並更新陣列距離
                        updateArrayDistances(userLat, userLng);
                        
                        // 更改狀態文字
                        statusElements.forEach(el => el.innerText = "距離已按定位更新");
                    },
                    (error) => {
                        console.warn('GPS 授權失敗或無法取得位置:', error);
                        statusElements.forEach(el => el.innerText = "無法獲取定位，顯示預設資料");
                        fallbackMockDistances();
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                statusElements.forEach(el => el.innerText = "瀏覽器不支援定位");
                fallbackMockDistances();
            }
        }

        // 計算距離並排序
        function updateArrayDistances(userLat, userLng) {
            // 計算 EV
            mockEvStations.forEach(station => {
                station.rawDistance = calculateDistance(userLat, userLng, station.lat, station.lng);
                station.distance = station.rawDistance.toFixed(1) + " km";
            });
            mockEvStations.sort((a, b) => a.rawDistance - b.rawDistance);

            // 計算 Parking
            mockParkingStations.forEach(station => {
                station.rawDistance = calculateDistance(userLat, userLng, station.lat, station.lng);
                station.distance = station.rawDistance.toFixed(1) + " km";
            });
            mockParkingStations.sort((a, b) => a.rawDistance - b.rawDistance);

            // 重新渲染排序後的列表
            renderEvStations();
            renderParkingStations();
        }

        // 如果無法獲取定位的降級處理 (套用假的距離數字以便預覽)
        function fallbackMockDistances() {
            mockEvStations[0].distance = "0.8 km"; mockEvStations[1].distance = "1.2 km"; 
            mockEvStations[2].distance = "2.5 km"; mockEvStations[3].distance = "1.0 km";
            
            mockParkingStations[0].distance = "0.5 km"; mockParkingStations[1].distance = "1.0 km";
            mockParkingStations[2].distance = "1.5 km"; mockParkingStations[3].distance = "1.2 km";
            
            renderEvStations();
            renderParkingStations();
        }

        // --- 渲染函數 ---
        
        function updateDashboard() {
            let totalParkAvail = 0;
            mockParkingStations.forEach(p => totalParkAvail += p.available);
            document.getElementById('dash-parking-total').innerText = totalParkAvail;

            let totalFastAvail = 0; let totalMidAvail = 0;
            mockEvStations.forEach(ev => {
                if (ev.status !== 'offline') {
                    totalFastAvail += ev.fast.available; totalMidAvail += ev.medium.available;
                }
            });
            document.getElementById('dash-ev-fast').innerText = totalFastAvail;
            document.getElementById('dash-ev-mid').innerText = totalMidAvail;
        }

        function renderParkingStations() {
            const listEl = document.getElementById('parking-list');
            listEl.innerHTML = '';
            mockParkingStations.forEach(park => {
                let statusClass = 'status-good';
                if (park.available === 0) statusClass = 'status-full';
                else if (park.available < 20) statusClass = 'status-warning';

                listEl.innerHTML += `
                    <div class="park-item ${statusClass}">
                        <div class="park-info">
                            <div class="park-title">${park.name}</div>
                            <div class="park-address">${park.address}</div>
                            <div class="park-distance">${park.distance}</div>
                        </div>
                        <div class="park-numbers">
                            <div class="park-available">${park.available}</div>
                            <div class="park-total">/ ${park.total} 位</div>
                        </div>
                    </div>
                `;
            });
        }

        function getAvailabilityClass(available, total) {
            if (total === 0) return '';
            if (available === 0) return 'available-none';
            if (available <= 1) return 'available-low';
            return 'available-high';
        }

        function renderEvStations() {
            const evListEl = document.getElementById('ev-list');
            evListEl.innerHTML = '';
            mockEvStations.forEach(station => {
                const isOffline = station.status === 'offline';
                const fastClass = getAvailabilityClass(station.fast.available, station.fast.total);
                const mediumClass = getAvailabilityClass(station.medium.available, station.medium.total);

                evListEl.innerHTML += `
                    <div class="ev-item ${isOffline ? 'offline' : ''}">
                        <div class="ev-header">
                            <div class="ev-title">${station.name}</div>
                            <div class="ev-address">${station.address}</div>
                            <div class="ev-distance">${station.distance}</div>
                        </div>
                        <div class="ev-chargers">
                            <div class="charger-type">
                                <span class="charger-label">快速充電 (DC)</span>
                                <div class="charger-data ${fastClass}">
                                    <span>${station.fast.available}</span> / ${station.fast.total}
                                </div>
                            </div>
                            <div class="charger-type">
                                <span class="charger-label">中速充電 (AC)</span>
                                <div class="charger-data ${mediumClass}">
                                    <span>${station.medium.available}</span> / ${station.medium.total}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
