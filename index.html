<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>附近停車場空置車位</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang HK", "Noto Sans TC", sans-serif;
      color: #0f172a;
      background: #eef2f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      padding: 22px 16px 18px;
      color: white;
      background: #0f172a;
    }
    h1 { margin: 0 0 6px; font-size: 1.35rem; }
    header p { margin: 0; color: #cbd5e1; font-size: .9rem; }
    main { max-width: 780px; margin: auto; padding: 14px; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
    }
    select, button {
      min-height: 46px;
      border-radius: 12px;
      padding: 0 14px;
      font: inherit;
    }
    select {
      background: white;
      border: 1px solid #cbd5e1;
    }
    button {
      border: 0;
      color: white;
      background: #2563eb;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }

    #status {
      margin: 8px 2px 14px;
      color: #475569;
      font-size: .92rem;
    }
    .card {
      margin-bottom: 12px;
      padding: 16px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 2px 10px rgb(15 23 42 / 7%);
    }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .name { margin: 0; font-size: 1.08rem; }
    .distance {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 5px 9px;
      background: #e2e8f0;
      color: #334155;
      font-size: .8rem;
      font-weight: 700;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .badge {
      border-radius: 999px;
      padding: 4px 8px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: .72rem;
      font-weight: 700;
    }
    .badge.mall {
      background: #f5f3ff;
      color: #6d28d9;
    }
    .address {
      margin: 9px 0 14px;
      color: #64748b;
      font-size: .9rem;
      line-height: 1.45;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat {
      padding: 11px;
      border-radius: 12px;
      background: #f8fafc;
    }
    .label { color: #64748b; font-size: .78rem; }
    .value { margin-top: 3px; font-size: 1.12rem; font-weight: 800; }
    .available { color: #15803d; }
    .full { color: #dc2626; }
    .unknown { color: #64748b; }
    .meta {
      margin-top: 10px;
      color: #94a3b8;
      font-size: .75rem;
      line-height: 1.45;
    }
    .empty, .error {
      padding: 22px 16px;
      border-radius: 14px;
      background: white;
      text-align: center;
      line-height: 1.6;
    }
    .error { color: #b91c1c; }

    @media (max-width: 560px) {
      .controls { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>附近停車場空置車位</h1>
    <p>整合政府公開資料及自訂商場停車場資料。</p>
  </header>

  <main>
    <div class="controls">
      <select id="radius" aria-label="搜尋範圍">
        <option value="1">1 公里內</option>
        <option value="3" selected>3 公里內</option>
        <option value="5">5 公里內</option>
        <option value="10">10 公里內</option>
        <option value="999">全部停車場</option>
      </select>

      <select id="typeFilter" aria-label="停車場類型">
        <option value="all">全部停車場</option>
        <option value="mall">只顯示商場</option>
        <option value="government">只顯示政府 API</option>
      </select>

      <button id="locate">定位及更新</button>
    </div>

    <div id="status">按「定位及更新」開始。</div>
    <section id="results"></section>
  </main>

  <script>
    /*
      政府 API：
      1. 基本資料：名稱、地址、經緯度
      2. 即時空置：私家車 / 時租剩餘車位
    */
    const BASIC_URL =
      "https://resource.data.one.gov.hk/td/carpark/basic_info_all.json";
    const VACANCY_URL =
      "https://resource.data.one.gov.hk/td/carpark/vacancy_all.json";

    /*
      自訂商場停車場資料。

      可直接填入固定資料，或把 vacancyUrl 指向自己的 Cloudflare Worker JSON。
      若商場沒有公開即時資料，vacancy 可設為 null。

      建議統一格式：
      {
        id,
        name,
        address,
        latitude,
        longitude,
        total,
        vacancy,
        vacancyType: "A" | "B" | "C",
        lastUpdate,
        source
      }
    */
    const MALL_CARPARKS = [
      {
        id: "mall_demo_1",
        name: "示例商場停車場",
        address: "請在程式內修改為實際地址",
        latitude: 22.3193,
        longitude: 114.1694,
        total: 500,
        vacancy: null,
        vacancyType: "A",
        lastUpdate: "",
        source: "自訂商場資料"
      }
    ];

    /*
      可選：外部商場 JSON。
      最簡單做法是使用 Cloudflare Worker 回傳以下格式：

      {
        "carparks": [
          {
            "id": "mall_001",
            "name": "某某商場停車場",
            "address": "香港某區某道",
            "latitude": 22.3000,
            "longitude": 114.1700,
            "total": 350,
            "vacancy": 42,
            "vacancyType": "A",
            "lastUpdate": "2026-08-04 23:00:00",
            "source": "商場官方網站"
          }
        ]
      }

      沒有外部資料時保持空字串。
    */
    const MALL_JSON_URL = "";

    const $ = (selector) => document.querySelector(selector);
    const button = $("#locate");
    const statusBox = $("#status");
    const results = $("#results");

    let lastPosition = null;
    let cachedData = [];

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function distanceKm(lat1, lon1, lat2, lon2) {
      const toRad = value => value * Math.PI / 180;
      const earthRadiusKm = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) ** 2;

      return 2 * earthRadiusKm * Math.asin(Math.sqrt(a));
    }

    function getPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("此瀏覽器不支援定位。"));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          resolve,
          reject,
          {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 60000
          }
        );
      });
    }

    function findPrivateCarVacancy(carPark) {
      const vehicle = (carPark?.vehicle_type || []).find(
        item => item.type === "P"
      );

      if (!vehicle) return null;

      return (
        (vehicle.service_category || []).find(
          item => item.category === "HOURLY"
        ) ||
        vehicle.service_category?.[0] ||
        null
      );
    }

    function getGovernmentCapacity(info, vacancy) {
      const candidates = [
        info.total_spaces,
        info.total_space,
        info.capacity,
        info.total_parking_spaces,
        vacancy?.total_spaces,
        vacancy?.capacity
      ];

      const value = candidates.find(
        item => Number.isFinite(Number(item)) && Number(item) >= 0
      );

      return value === undefined ? null : Number(value);
    }

    function formatVacancy(vacancyType, vacancy) {
      const numericVacancy = Number(vacancy);

      if (vacancyType === "C") {
        return { text: "停車場關閉", cssClass: "full" };
      }

      if (vacancy === null || vacancy === undefined || numericVacancy === -1) {
        return { text: "沒有資料", cssClass: "unknown" };
      }

      if (vacancyType === "A") {
        return numericVacancy === 0
          ? { text: "已滿", cssClass: "full" }
          : { text: `${numericVacancy} 個`, cssClass: "available" };
      }

      if (vacancyType === "B") {
        return numericVacancy === 0
          ? { text: "已滿", cssClass: "full" }
          : { text: "有車位", cssClass: "available" };
      }

      return { text: "沒有資料", cssClass: "unknown" };
    }

    async function loadExternalMallData() {
      if (!MALL_JSON_URL) return [];

      try {
        const response = await fetch(MALL_JSON_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("商場 JSON 讀取失敗");

        const data = await response.json();
        return Array.isArray(data) ? data : (data.carparks || []);
      } catch (error) {
        console.warn(error);
        return [];
      }
    }

    function normalizeGovernmentData(basicData, vacancyData) {
      const vacancyMap = new Map(
        (vacancyData.car_park || []).map(item => [item.park_id, item])
      );

      return (basicData.car_park || []).map(info => {
        const vacancyRecord = vacancyMap.get(info.park_id);
        const vacancy = findPrivateCarVacancy(vacancyRecord);

        return {
          id: info.park_id,
          name:
            info.name_tc ||
            info.name_en ||
            "未命名停車場",
          address:
            info.displayAddress_tc ||
            info.displayaddress_tc ||
            info.displayAddress_en ||
            info.displayaddress_en ||
            "地址未提供",
          latitude: Number(info.latitude),
          longitude: Number(info.longitude),
          total: getGovernmentCapacity(info, vacancy),
          vacancy: vacancy?.vacancy ?? null,
          vacancyType: vacancy?.vacancy_type || "A",
          lastUpdate: vacancy?.lastupdate || "",
          source: "政府公開數據",
          type: "government"
        };
      });
    }

    function normalizeMallData(items) {
      return (items || []).map(item => ({
        id: item.id,
        name: item.name || "未命名商場停車場",
        address: item.address || "地址未提供",
        latitude: Number(item.latitude),
        longitude: Number(item.longitude),
        total:
          Number.isFinite(Number(item.total)) && Number(item.total) >= 0
            ? Number(item.total)
            : null,
        vacancy:
          item.vacancy === null || item.vacancy === undefined
            ? null
            : Number(item.vacancy),
        vacancyType: item.vacancyType || "A",
        lastUpdate: item.lastUpdate || "",
        source: item.source || "商場資料",
        type: "mall"
      }));
    }

    function renderResults() {
      if (!lastPosition) return;

      const radius = Number($("#radius").value);
      const typeFilter = $("#typeFilter").value;

      const userLat = lastPosition.coords.latitude;
      const userLon = lastPosition.coords.longitude;

      const filtered = cachedData
        .map(item => ({
          ...item,
          distance: distanceKm(
            userLat,
            userLon,
            item.latitude,
            item.longitude
          )
        }))
        .filter(item =>
          Number.isFinite(item.latitude) &&
          Number.isFinite(item.longitude) &&
          Number.isFinite(item.distance) &&
          item.distance <= radius
        )
        .filter(item =>
          typeFilter === "all" || item.type === typeFilter
        )
        .sort((a, b) => a.distance - b.distance);

      statusBox.textContent =
        `定位準確度約 ${Math.round(lastPosition.coords.accuracy)} 米；` +
        `找到 ${filtered.length} 個停車場。`;

      if (!filtered.length) {
        results.innerHTML =
          '<div class="empty">搜尋範圍內沒有符合條件的停車場。</div>';
        return;
      }

      results.innerHTML = filtered.map(item => {
        const vacancyDisplay = formatVacancy(
          item.vacancyType,
          item.vacancy
        );

        const totalText =
          item.total === null ? "未收錄" : `${item.total} 個`;

        return `
          <article class="card">
            <div class="top">
              <div>
                <h2 class="name">${escapeHtml(item.name)}</h2>
                <div class="badges">
                  <span class="badge ${item.type === "mall" ? "mall" : ""}">
                    ${item.type === "mall" ? "商場停車場" : "政府 API"}
                  </span>
                </div>
              </div>
              <span class="distance">${item.distance.toFixed(2)} km</span>
            </div>

            <div class="address">${escapeHtml(item.address)}</div>

            <div class="stats">
              <div class="stat">
                <div class="label">總提供車位</div>
                <div class="value ${item.total === null ? "unknown" : ""}">
                  ${totalText}
                </div>
              </div>

              <div class="stat">
                <div class="label">剩餘車位</div>
                <div class="value ${vacancyDisplay.cssClass}">
                  ${vacancyDisplay.text}
                </div>
              </div>
            </div>

            <div class="meta">
              資料來源：${escapeHtml(item.source)}
              ${item.lastUpdate
                ? `・更新：${escapeHtml(item.lastUpdate)}`
                : ""}
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadNearby() {
      button.disabled = true;
      results.innerHTML = "";
      statusBox.textContent = "正在取得位置及停車場資料…";

      try {
        const [
          position,
          basicResponse,
          vacancyResponse,
          externalMallData
        ] = await Promise.all([
          getPosition(),
          fetch(BASIC_URL, { cache: "no-store" }),
          fetch(VACANCY_URL, { cache: "no-store" }),
          loadExternalMallData()
        ]);

        if (!basicResponse.ok || !vacancyResponse.ok) {
          throw new Error("未能讀取政府停車場 API。");
        }

        const [basicData, vacancyData] = await Promise.all([
          basicResponse.json(),
          vacancyResponse.json()
        ]);

        const governmentItems =
          normalizeGovernmentData(basicData, vacancyData);

        const mallItems =
          normalizeMallData([
            ...MALL_CARPARKS,
            ...externalMallData
          ]);

        lastPosition = position;
        cachedData = [...governmentItems, ...mallItems];

        renderResults();

      } catch (error) {
        console.error(error);

        let message = error.message || "發生錯誤。";

        if (error.code === 1) {
          message = "定位權限被拒絕，請允許瀏覽器使用位置。";
        }
        if (error.code === 2) {
          message = "暫時無法取得位置。";
        }
        if (error.code === 3) {
          message = "取得位置逾時，請再試一次。";
        }

        results.innerHTML =
          `<div class="error">${escapeHtml(message)}</div>`;

        statusBox.textContent =
          "提示：定位功能需要透過 HTTPS 網址或 localhost 開啟。";

      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", loadNearby);
    $("#radius").addEventListener("change", renderResults);
    $("#typeFilter").addEventListener("change", renderResults);
  </script>
</body>
</html>
