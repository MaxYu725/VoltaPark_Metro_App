<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltaPark</title>
    <style>
        /* 基礎 Metro UI 設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* 模擬手機或網頁置中寬度 */
            min-height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部導覽列 (Pivot Headers) */
        .pivot-container {
            padding: 30px 20px 10px 20px;
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none; /* Firefox */
        }
        .pivot-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .pivot-header {
            font-size: 42px;
            font-weight: 300;
            color: #555555;
            margin-right: 25px;
            cursor: pointer;
            transition: color 0.3s;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .pivot-header.active {
            color: #ffffff;
        }

        /* 頁面內容區 */
        .pivot-content {
            flex: 1;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .pivot-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 頂部狀態列 (工具列/篩選) */
        .status-bar {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-text {
            font-size: 14px;
            color: #888;
            text-transform: lowercase;
        }

        .action-text {
            font-size: 14px;
            color: #60a917; /* Metro Green */
            cursor: pointer;
            text-transform: lowercase;
        }

        /* 充電站列表項目 (EV Tile Style) */
        .ev-item {
            background-color: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-left: 6px solid #60a917;
        }

        .ev-item.offline {
            border-left-color: #555555;
        }
        .ev-item.offline .ev-title {
            color: #888888;
        }

        .ev-header {
            padding: 15px 15px 10px 15px;
        }

        .ev-title {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .ev-address {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 4px;
        }

        .ev-distance {
            font-size: 14px;
            color: #60a917;
            font-weight: 600;
        }

        .ev-item.offline .ev-distance {
            color: #555555;
        }

        /* 充電樁數據區塊 */
        .ev-chargers {
            display: flex;
            background-color: #252525;
            padding: 12px 15px;
            justify-content: space-between;
        }

        .charger-type {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex: 1;
        }

        .charger-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .charger-data {
            font-size: 14px;
            color: #ccc;
        }

        .charger-data span {
            font-size: 28px;
            font-weight: 300;
            color: #ffffff;
            margin-right: 2px;
        }

        /* 強調可用數字的顏色 */
        .available-high span { color: #60a917; } /* 綠色: 充裕 */
        .available-low span { color: #fa6800; }  /* 橙色: 緊張 */
        .available-none span { color: #ce352c; } /* 紅色: 爆滿 */

        /* 預留的其他頁面佔位符 */
        .placeholder-text {
            color: #555;
            font-size: 18px;
            margin-top: 40px;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Pivot Headers -->
        <div class="pivot-container" id="pivot-headers">
            <span class="pivot-header active" data-target="ev">ev charge</span>
            <span class="pivot-header" data-target="parking">parking</span>
            <span class="pivot-header" data-target="home">home</span>
        </div>

        <!-- EV Charge Page (設為預設頁面) -->
        <div class="pivot-content active" id="ev">
            <div class="status-bar">
                <span class="status-text">已按距離排序</span>
                <span class="action-text">篩選插頭類型</span>
            </div>
            <div id="ev-list">
                <!-- 列表將由 JS 動態渲染 -->
            </div>
        </div>

        <!-- Parking Page -->
        <div class="pivot-content" id="parking">
            <div class="status-bar">
                <span class="status-text">搜尋半徑 2.0 公里</span>
            </div>
            <div class="placeholder-text">停車場資訊開發中...</div>
        </div>

        <!-- Home Page -->
        <div class="pivot-content" id="home">
            <div class="status-bar">
                <span class="status-text">概覽</span>
            </div>
            <div class="placeholder-text">主頁資訊開發中...</div>
        </div>
    </div>

    <script>
        // 模擬充電站數據 (後續可替換為政府開放數據 API)
        const mockEvStations = [
            { 
                id: "ev_001", 
                name: "領展 - 祥華商場", 
                address: "粉嶺新運路38號", 
                distance: "0.8 km", 
                status: "online",
                fast: { total: 3, available: 2 },
                medium: { total: 5, available: 0 }
            },
            { 
                id: "ev_002", 
                name: "海聯廣場", 
                address: "粉嶺聯和墟和睦路9號", 
                distance: "1.2 km", 
                status: "online",
                fast: { total: 2, available: 0 },
                medium: { total: 4, available: 1 }
            },
            { 
                id: "ev_003", 
                name: "Tesla 超充 - 上水匯", 
                address: "上水石湖墟龍琛路48號", 
                distance: "2.5 km", 
                status: "online",
                fast: { total: 6, available: 5 },
                medium: { total: 0, available: 0 }
            },
            { 
                id: "ev_004", 
                name: "粉嶺中心 (維護中)", 
                address: "粉嶺新運路33號", 
                distance: "1.0 km", 
                status: "offline",
                fast: { total: 2, available: 0 },
                medium: { total: 2, available: 0 }
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            initPivot();
            renderEvStations();
        });

        // 處理 Metro Pivot 導覽切換邏輯
        function initPivot() {
            const headers = document.querySelectorAll('.pivot-header');
            headers.forEach(header => {
                header.addEventListener('click', () => {
                    const targetId = header.getAttribute('data-target');
                    
                    // 更新 Header 樣式
                    headers.forEach(h => h.classList.remove('active'));
                    header.classList.add('active');

                    // 更新 Content 顯示
                    document.querySelectorAll('.pivot-content').forEach(c => {
                        c.classList.remove('active');
                        if(c.id === targetId) {
                            c.classList.add('active');
                        }
                    });
                    
                    // 將點擊的標題平滑滾動至可視範圍
                    header.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                });
            });
        }

        // 判斷可用數量的顏色樣式
        function getAvailabilityClass(available, total) {
            if (total === 0) return '';
            if (available === 0) return 'available-none';
            if (available <= 1) return 'available-low';
            return 'available-high';
        }

        // 渲染充電站列表
        function renderEvStations() {
            const evListEl = document.getElementById('ev-list');
            evListEl.innerHTML = ''; // 清空內容

            mockEvStations.forEach(station => {
                const isOffline = station.status === 'offline';
                
                const fastClass = getAvailabilityClass(station.fast.available, station.fast.total);
                const mediumClass = getAvailabilityClass(station.medium.available, station.medium.total);

                const html = `
                    <div class="ev-item ${isOffline ? 'offline' : ''}">
                        <div class="ev-header">
                            <div class="ev-title">${station.name}</div>
                            <div class="ev-address">${station.address}</div>
                            <div class="ev-distance">${station.distance}</div>
                        </div>
                        <div class="ev-chargers">
                            <div class="charger-type">
                                <span class="charger-label">快速充電 (DC)</span>
                                <div class="charger-data ${fastClass}">
                                    <span>${station.fast.available}</span> / ${station.fast.total}
                                </div>
                            </div>
                            <div class="charger-type">
                                <span class="charger-label">中速充電 (AC)</span>
                                <div class="charger-data ${mediumClass}">
                                    <span>${station.medium.available}</span> / ${station.medium.total}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                evListEl.innerHTML += html;
            });
        }
    </script>
</body>
</html>
