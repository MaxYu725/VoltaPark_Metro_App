<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltaPark</title>
    <style>
        /* 基礎 Metro UI 設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部導覽列 */
        .pivot-container {
            padding: 30px 20px 10px 20px;
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .pivot-container::-webkit-scrollbar {
            display: none;
        }

        .pivot-header {
            font-size: 42px;
            font-weight: 300;
            color: #555555;
            margin-right: 25px;
            cursor: pointer;
            transition: color 0.3s;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .pivot-header.active {
            color: #ffffff;
        }

        /* 頁面內容區 */
        .pivot-content {
            flex: 1;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .pivot-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 頂部狀態列 */
        .status-bar {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-text {
            font-size: 14px;
            color: #888;
            text-transform: lowercase;
        }

        .action-text {
            font-size: 14px;
            color: #60a917;
            cursor: pointer;
            text-transform: lowercase;
        }

        /* 主頁動態磚 */
        .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-items: start;
        }

        .tile {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .tile.square {
            aspect-ratio: 1;
        }

        .tile:active {
            transform: scale(0.97);
        }

        .tile.wide {
            grid-column: span 2;
            min-height: 150px;
        }

        .tile-title {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .tile-value {
            font-size: 48px;
            font-weight: 300;
            text-align: right;
            line-height: 1;
        }

        .bg-blue { background-color: #1ba1e2; }
        .bg-green { background-color: #60a917; }
        .bg-orange { background-color: #fa6800; }
        .bg-teal { background-color: #00aba9; }

        /* 動態展開列表樣式 (緊湊排列) */
        .nearest-expanded {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
        }

        .tile.expanded .nearest-expanded {
            max-height: 250px;
            opacity: 1;
            margin-top: 15px;
        }

        .compact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .compact-item:first-child {
            border-top: none;
            padding-top: 0;
        }

        .compact-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .compact-name {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .compact-dist {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2px;
        }

        .compact-val {
            font-size: 24px;
            font-weight: 300;
        }

        /* 停車場列表項目 */
        .park-item {
            background-color: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-left: 6px solid #555;
        }

        .park-item.status-good { border-left-color: #60a917; }
        .park-item.status-warning { border-left-color: #fa6800; }
        .park-item.status-full { border-left-color: #ce352c; }
        .park-item.status-unknown { border-left-color: #444444; opacity: 0.8; }

        .park-info { flex: 1; padding-right: 10px; }
        .park-title { font-size: 22px; font-weight: 400; margin-bottom: 4px; line-height: 1.2; }
        .park-address { font-size: 13px; color: #aaa; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .park-distance { font-size: 14px; color: #1ba1e2; font-weight: 600; }

        .park-numbers { text-align: right; min-width: 80px; }
        .park-available { font-size: 36px; font-weight: 300; line-height: 1; }
        .park-item.status-full .park-available { color: #ce352c; }
        .park-item.status-warning .park-available { color: #fa6800; }
        .park-item.status-unknown .park-available { color: #888; font-size: 18px; font-weight: 400; margin-bottom: 5px; }
        .park-total { font-size: 12px; color: #888; margin-top: 4px; }

        /* 充電站列表項目 */
        .ev-item {
            background-color: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-left: 6px solid #60a917;
        }

        .ev-item.offline { border-left-color: #555555; }
        .ev-item.offline .ev-title { color: #888888; }
        .ev-item.offline .ev-distance { color: #555555; }

        .ev-header { padding: 15px 15px 10px 15px; }
        .ev-title { font-size: 24px; font-weight: 400; margin-bottom: 4px; }
        .ev-address { font-size: 13px; color: #aaaaaa; margin-bottom: 4px; }
        .ev-distance { font-size: 14px; color: #60a917; font-weight: 600; }

        .ev-chargers {
            display: flex;
            background-color: #252525;
            padding: 12px 15px;
            justify-content: space-between;
        }

        .charger-type { display: flex; flex-direction: column; flex: 1; }
        .charger-label { font-size: 12px; color: #888; margin-bottom: 2px; }
        .charger-data { font-size: 14px; color: #ccc; }
        .charger-data span { font-size: 28px; font-weight: 300; color: #ffffff; margin-right: 2px; }

        .available-high span { color: #60a917; }
        .available-low span { color: #fa6800; }
        .available-none span { color: #ce352c; }

        .loading-text {
            color: #888;
            font-size: 18px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="pivot-container" id="pivot-headers">
            <span class="pivot-header active" data-target="home">home</span>
            <span class="pivot-header" data-target="parking">parking</span>
            <span class="pivot-header" data-target="ev">ev charge</span>
        </div>

        <div class="pivot-content active" id="home">
            <div class="status-bar">
                <span class="status-text location-status">等待授權定位...</span>
            </div>
            <div class="tile-grid">
                
                <!-- 互動式首頁大磚 -->
                <div class="tile wide bg-blue" onclick="this.classList.toggle('expanded')">
                    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div class="tile-title">最近停車場</div>
                            <div id="dash-nearest-dist" style="font-size:14px; opacity:0.8;">--</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px;">
                            <div id="dash-nearest-name" style="font-size: 24px; font-weight: 400; line-height: 1.1; max-width: 65%;">請先授權定位</div>
                            <div id="dash-nearest-val" style="font-size: 48px; font-weight: 300; line-height: 1;">--</div>
                        </div>
                    </div>
                    <!-- 隱藏的展開列表 -->
                    <div class="nearest-expanded" id="dash-expanded-list">
                        <!-- JS 動態插入緊湊項目 -->
                    </div>
                </div>

                <div class="tile square bg-green" onclick="navigateTo('ev')">
                    <div class="tile-title">可用快充</div>
                    <div class="tile-value" id="dash-ev-fast">--</div>
                </div>
                <div class="tile square bg-teal" onclick="navigateTo('ev')">
                    <div class="tile-title">可用中充</div>
                    <div class="tile-value" id="dash-ev-mid">--</div>
                </div>
                <div class="tile square bg-orange">
                    <div class="tile-title">API 連線</div>
                    <div class="tile-value" id="dash-api-status" style="font-size: 28px; margin-top: 20px;">等待中</div>
                </div>
            </div>
        </div>

        <div class="pivot-content" id="parking">
            <div class="status-bar">
                <span class="status-text location-status">等待定位中...</span>
            </div>
            <div id="parking-list">
                <div class="loading-text">正在等待定位以載入附近資料...</div>
            </div>
        </div>

        <div class="pivot-content" id="ev">
            <div class="status-bar">
                <span class="status-text location-status">等待定位中...</span>
                <span class="action-text">篩選插頭類型</span>
            </div>
            <div id="ev-list">
                <div class="loading-text">正在載入充電站資料...</div>
            </div>
        </div>
    </div>

    <script>
        let evStations = [
            { id: "ev_001", name: "MegaBox (Tesla)", address: "九龍灣宏照道38號", lat: 22.3197, lng: 114.2081, distance: "計算中...", status: "online", fast: { total: 6, available: 2 }, medium: { total: 10, available: 4 } },
            { id: "ev_002", name: "E-Max (中電)", address: "九龍灣展貿徑1號", lat: 22.3242, lng: 114.2045, distance: "計算中...", status: "online", fast: { total: 3, available: 0 }, medium: { total: 8, available: 1 } },
            { id: "ev_003", name: "德福廣場一期", address: "九龍灣偉業街33號", lat: 22.3218, lng: 114.2133, distance: "計算中...", status: "online", fast: { total: 2, available: 1 }, medium: { total: 0, available: 0 } },
            { id: "ev_004", name: "領展 - 祥華商場", address: "粉嶺新運路38號", lat: 22.4918, lng: 114.1430, distance: "計算中...", status: "online", fast: { total: 3, available: 2 }, medium: { total: 5, available: 0 } },
            { id: "ev_005", name: "Tesla 超充 - 上水匯", address: "上水石湖墟龍琛路48號", lat: 22.5033, lng: 114.1273, distance: "計算中...", status: "online", fast: { total: 6, available: 5 }, medium: { total: 0, available: 0 } }
        ];

        let parkingStations = []; 

        document.addEventListener('DOMContentLoaded', () => {
            initPivot();
            // 反轉流程：先拿定位，有了 extent 之後才抓 API
            startAppProcess();
        });

        function initPivot() {
            const headers = document.querySelectorAll('.pivot-header');
            headers.forEach(header => {
                header.addEventListener('click', () => {
                    navigateTo(header.getAttribute('data-target'));
                });
            });
        }

        function navigateTo(targetId) {
            document.querySelectorAll('.pivot-header').forEach(h => {
                if(h.getAttribute('data-target') === targetId) {
                    h.classList.add('active');
                    h.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    h.classList.remove('active');
                }
            });
            document.querySelectorAll('.pivot-content').forEach(c => {
                c.classList.remove('active');
                if(c.id === targetId) c.classList.add('active');
            });
        }

        // ==========================================
        // 核心運算：距離與 Extent 計算
        // ==========================================
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // 回傳公里 (km)
        }

        // 精細化距離顯示邏輯 (小於 1km 顯示 m，否則顯示 km)
        function formatDistance(distKm) {
            if (distKm < 1) {
                return Math.round(distKm * 1000) + " m";
            } else {
                return distKm.toFixed(1) + " km";
            }
        }

        // ==========================================
        // 流程控制：取得定位 -> 算 Bounding Box -> 打 API
        // ==========================================
        function startAppProcess() {
            updateStatusText("正在獲取 GPS 定位...");
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        
                        // 計算約 5 公里半徑的 Bounding Box (Extent)
                        // 1 度緯度約 111 公里，1 度經度在香港(22度)約 102 公里
                        const dLat = 5 / 111;
                        const dLng = 5 / 102;
                        const extent = `${userLng - dLng},${userLat - dLat},${userLng + dLng},${userLat + dLat}`;
                        
                        fetchGovParkingData(extent, userLat, userLng);
                    },
                    (error) => {
                        console.warn('GPS 失敗:', error);
                        updateStatusText("未授權定位，下載全港資料中...");
                        // GPS 失敗時，不帶 extent，退回抓全港資料
                        fetchGovParkingData(null, null, null);
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                updateStatusText("瀏覽器不支援定位，下載全港資料中...");
                fetchGovParkingData(null, null, null);
            }
        }

        // ==========================================
        // 強化版 API 抓取 (相容兩種結構，支援 Extent)
        // ==========================================
        async function fetchGovParkingData(extent, userLat, userLng) {
            try {
                // 根據有沒有 extent 決定使用哪組 URL
                let infoUrl = 'https://resource.data.one.gov.hk/td/carpark/basic_info_all.json';
                let vacancyUrl = 'https://resource.data.one.gov.hk/td/carpark/vacancy_all.json';
                
                if (extent) {
                    updateStatusText("正在下載附近停車場資料...");
                    infoUrl = `https://api.data.gov.hk/v1/carpark-info-vacancy?data=info&vehicleTypes=privateCar&extent=${extent}&lang=zh_TW`;
                    vacancyUrl = `https://api.data.gov.hk/v1/carpark-info-vacancy?data=vacancy&vehicleTypes=privateCar&extent=${extent}&lang=zh_TW`;
                }

                document.getElementById('dash-api-status').innerText = "下載中";

                const [infoRes, vacRes] = await Promise.all([
                    fetch(infoUrl),
                    fetch(vacancyUrl)
                ]);

                const infoData = await infoRes.json();
                const vacData = await vacRes.json();

                // 為了相容 api.data.gov.hk (results) 與 resource.data.one (car_park) 結構
                const infoList = infoData.results || infoData.car_park || [];
                const vacList = vacData.results || vacData.car_park || [];

                const vacMap = {};
                vacList.forEach(v => {
                    let available = -1;
                    const vTypes = v.vehicleTypes || v.vehicle_type || [];

                    // 尋找私家車相關的物件
                    const pType = vTypes.find(t => {
                        const tName = t.type || '';
                        return tName.toLowerCase().includes('private') || tName === 'P';
                    });
                    
                    if (pType) {
                        if (pType.service_category && Array.isArray(pType.service_category)) {
                            const svc = pType.service_category.find(s => s.category === 'HOURLY') || pType.service_category[0];
                            if (svc && svc.vacancy !== undefined && svc.vacancy !== null) {
                                available = parseInt(svc.vacancy);
                            }
                        } else if (pType.vacancy !== undefined && pType.vacancy !== null) {
                            available = parseInt(pType.vacancy);
                        }
                    } else if (v.vacancy !== undefined && v.vacancy !== null) {
                        available = parseInt(v.vacancy);
                    }
                    
                    if (isNaN(available)) available = -1;
                    // 相容 park_Id 與 park_id
                    const idStr = String(v.park_Id || v.park_id).trim();
                    vacMap[idStr] = available;
                });

                parkingStations = infoList.map(p => {
                    const lat = parseFloat(p.latitude);
                    const lng = parseFloat(p.longitude);
                    const idStr = String(p.park_Id || p.park_id).trim();
                    
                    // 相容不同的大小寫與欄位
                    let displayAddr = p.displayAddress_tc || p.displayaddress_tc || p.displayAddress_en || p.displayaddress_en || p.address || '';
                    if (displayAddr.trim() === '') {
                        displayAddr = p.district_tc || p.district_en || '地址未提供';
                    }
                    
                    return {
                        id: idStr,
                        name: p.name_tc || p.name_en || p.name || '停車場',
                        address: displayAddr,
                        lat: isNaN(lat) ? 0 : lat,
                        lng: isNaN(lng) ? 0 : lng,
                        distance: "計算中...",
                        rawDistance: 9999,
                        available: vacMap[idStr] !== undefined ? vacMap[idStr] : -1,
                        total: null
                    };
                }).filter(p => p.lat !== 0); 

                document.getElementById('dash-api-status').innerText = "正常";
                document.getElementById('dash-api-status').style.color = "#ffffff";

                // 如果有拿到定位，就計算距離並排序
                if (userLat && userLng) {
                    updateArrayDistances(userLat, userLng);
                    updateStatusText("已定位，顯示附近資料");
                } else {
                    renderParkingStations();
                    updateDashboardWithoutLocation();
                }

            } catch (error) {
                console.error("API 串接失敗:", error);
                document.getElementById('dash-api-status').innerText = "連線失敗";
                document.getElementById('dash-api-status').style.color = "#ce352c";
                updateStatusText("API 錯誤");
                document.getElementById('parking-list').innerHTML = '<div class="loading-text">無法連接政府開放數據</div>';
            }
        }

        function updateStatusText(text) {
            document.querySelectorAll('.location-status').forEach(el => el.innerText = text);
        }

        function updateArrayDistances(userLat, userLng) {
            evStations.forEach(station => {
                station.rawDistance = calculateDistance(userLat, userLng, station.lat, station.lng);
                station.distance = formatDistance(station.rawDistance);
            });
            evStations.sort((a, b) => a.rawDistance - b.rawDistance);

            parkingStations.forEach(station => {
                station.rawDistance = calculateDistance(userLat, userLng, station.lat, station.lng);
                station.distance = formatDistance(station.rawDistance);
            });
            parkingStations.sort((a, b) => a.rawDistance - b.rawDistance);

            renderEvStations();
            renderParkingStations();
            updateDashboard();
        }

        // ==========================================
        // UI 更新與渲染
        // ==========================================
        function updateDashboard() {
            const dashName = document.getElementById('dash-nearest-name');
            const dashDist = document.getElementById('dash-nearest-dist');
            const dashVal = document.getElementById('dash-nearest-val');
            const dashExpandList = document.getElementById('dash-expanded-list');

            if (parkingStations.length > 0) {
                // 第一名：大磚塊顯示
                const nearest = parkingStations[0];
                dashName.innerText = nearest.name;
                dashDist.innerText = nearest.rawDistance === 9999 ? '未知' : nearest.distance;
                dashVal.innerText = nearest.available < 0 ? '--' : nearest.available;
                
                if (nearest.available === 0) dashVal.style.color = '#ce352c';
                else if (nearest.available > 0 && nearest.available < 15) dashVal.style.color = '#fa6800';
                else dashVal.style.color = '#ffffff';

                // 第 2~4 名：展開清單緊湊顯示
                dashExpandList.innerHTML = '';
                const nextThree = parkingStations.slice(1, 4);
                nextThree.forEach(p => {
                    let availText = p.available < 0 ? '--' : p.available;
                    let colorClass = '';
                    if (p.available === 0) colorClass = 'color: #ce352c;';
                    else if (p.available > 0 && p.available < 15) colorClass = 'color: #fa6800;';

                    dashExpandList.innerHTML += `
                        <div class="compact-item">
                            <div class="compact-info">
                                <span class="compact-name">${p.name}</span>
                                <span class="compact-dist">${p.rawDistance === 9999 ? '未知' : p.distance}</span>
                            </div>
                            <span class="compact-val" style="${colorClass}">${availText}</span>
                        </div>
                    `;
                });
            } else {
                dashName.innerText = "附近無資料";
            }

            let totalFastAvail = 0; let totalMidAvail = 0;
            evStations.forEach(ev => {
                if (ev.status !== 'offline') {
                    totalFastAvail += ev.fast.available; totalMidAvail += ev.medium.available;
                }
            });
            document.getElementById('dash-ev-fast').innerText = totalFastAvail;
            document.getElementById('dash-ev-mid').innerText = totalMidAvail;
        }

        function updateDashboardWithoutLocation() {
            document.getElementById('dash-nearest-name').innerText = "未定位";
            document.getElementById('dash-nearest-dist').innerText = "--";
            document.getElementById('dash-nearest-val').innerText = "--";
        }

        function renderParkingStations() {
            const listEl = document.getElementById('parking-list');
            listEl.innerHTML = '';
            
            if(parkingStations.length === 0) {
                listEl.innerHTML = '<div class="loading-text">附近沒有找到停車場資料</div>';
                return;
            }

            const displayParkings = parkingStations.slice(0, 30);

            displayParkings.forEach(park => {
                let statusClass = 'status-good';
                let availText = park.available;
                let totalText = '車位';

                if (park.available === 0) {
                    statusClass = 'status-full';
                    availText = '0';
                } else if (park.available < 0) {
                    statusClass = 'status-unknown';
                    availText = '無數據'; 
                    totalText = '未提供即時資訊';
                } else if (park.available < 15) {
                    statusClass = 'status-warning';
                }

                listEl.innerHTML += `
                    <div class="park-item ${statusClass}">
                        <div class="park-info">
                            <div class="park-title">${park.name}</div>
                            <div class="park-address">${park.address}</div>
                            <div class="park-distance">${park.rawDistance === 9999 ? '計算中...' : park.distance}</div>
                        </div>
                        <div class="park-numbers">
                            <div class="park-available">${availText}</div>
                            <div class="park-total">${totalText}</div>
                        </div>
                    </div>
                `;
            });
        }

        function renderEvStations() {
            const evListEl = document.getElementById('ev-list');
            evListEl.innerHTML = '';
            evStations.forEach(station => {
                const isOffline = station.status === 'offline';
                const fastClass = (station.fast.total === 0) ? '' : (station.fast.available === 0 ? 'available-none' : (station.fast.available <= 1 ? 'available-low' : 'available-high'));
                const mediumClass = (station.medium.total === 0) ? '' : (station.medium.available === 0 ? 'available-none' : (station.medium.available <= 1 ? 'available-low' : 'available-high'));

                evListEl.innerHTML += `
                    <div class="ev-item ${isOffline ? 'offline' : ''}">
                        <div class="ev-header">
                            <div class="ev-title">${station.name}</div>
                            <div class="ev-address">${station.address}</div>
                            <div class="ev-distance">${station.rawDistance === 9999 ? '計算中...' : station.distance}</div>
                        </div>
                        <div class="ev-chargers">
                            <div class="charger-type">
                                <span class="charger-label">快速充電 (DC)</span>
                                <div class="charger-data ${fastClass}">
                                    <span>${station.fast.available}</span> / ${station.fast.total}
                                </div>
                            </div>
                            <div class="charger-type">
                                <span class="charger-label">中速充電 (AC)</span>
                                <div class="charger-data ${mediumClass}">
                                    <span>${station.medium.available}</span> / ${station.medium.total}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
